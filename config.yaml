        ETN: {group: "core", kind: "equipment", business_kr: "배전·UPS·전력관리(전기 부문)", business_en: "Power distribution, UPS, power management (electrical)"}
        GEV: {group: "core", kind: "equipment", business_kr: "가스터빈·풍력·전력망 기기(Electrification)", business_en: "Gas turbines, wind, grid equipment (Electrification)"}
        CEG: {group: "reference", kind: "generation", business_kr: "원전 중심 발전사업자 — 전력 판매·PPA", business_en: "Nuclear-led generator — power sales, PPAs"}
