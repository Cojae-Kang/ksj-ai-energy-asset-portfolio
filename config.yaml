                              url: "https://www.mt.co.kr/stock/2026/03/04/2026030410445340662", published: "2026-03-04"}
    monte_carlo:
      horizon_years: 1                  # 상장 1년 후: 이익은 1년 성장, 배수는 시나리오 분포 (분석 설정)
      convergence: [1000, 2000, 5000, 10000]
      tolerance: 0.01                   # 마지막 두 단계 P50 상대 차이 ≤ 1%면 수렴 (분석 설정)
      check_multiple: 10                # 수렴 진단: 같은 seed로 n × 10회 재실행한 P50과 비교 (보고값은 n회 결과 그대로)
      corr_stress: 0.5                  # ASSUMPTION(judgment): 동조 민감도 — 성장률·PER·순이익률 쌍별 상관 0.5 (하방이 함께 오는 경우)
    # 증권신고서 할인율 실증 (research.vol03.ipo_discounts, 로컬 실행: DART 공시검색 + 원문). 결과 n ≥ min_n이면 밴드 할인율을 분포 기반(sourced)으로
    ipo_discounts:
      bgn_de: "20241201"                # 2024-12 접수 최초 신고서까지 포함 (2025-01 정정분이 최초로 잡히는 문제 방지)
      end_de: "20261020"
      pblntf_ty: "C"                    # 발행공시
      pblntf_detail_ty: "C001"          # ASSUMPTION(verify): 증권신고서(지분증권)
      report_nm_contains: ["증권신고서(지분증권)"]
      # IPO 여부는 '신고서 접수 시점' 기준으로 판정 (DART corp_cls는 현재 상장 상태 → 필터로 쓰면 이후 상장한 회사가 빠지는 look-ahead bias)
      #   (b) 상장일 확인: 검색 결과 stock_code(현재) + 로컬 KRX 종목기본정보 LIST_DD → 상장일 ≤ 접수일이면 원문 없이 제외(상장사 유상증자 등)
      #   (a) 원문 확인: 희망공모가 밴드 + IPO 문구(ipo_keywords) 둘 다 있어야 사용. 상장일을 모르면 (a)만으로 판정
      corp_cls_filter: false            # true면 예전 방식(현재 corp_cls ∈ corp_cls)으로 거름 — 비교·재현용
      corp_cls: ["E"]
      ipo_keywords: ["수요\\s*예측", "상장\\s*(?:할\\s*)?예정", "신규\\s*상장", "상장\\s*예비\\s*심사", "상장\\s*신청", "희망\\s*공모\\s*가"]
      ipo_min_keywords: 2               # 서로 다른 IPO 문구가 이 개수 이상 (밴드 문구 포함)
      listing_sources:                  # 상장일 조회 (로컬 파일만 읽음, 없으면 (a)만으로 판정)
        krx_raw_globs: ["base_info_*.json", "ksq_base_info_*.json"]   # data/raw/krx/ (KRX Open API OutBlock_1: ISU_SRT_CD, LIST_DD)
        processed: data/processed/vol03_listing_dates.csv            # --listing-dates로 만든 상장일 표
        manual: data/manual/vol03_listing_dates_manual.csv           # 수동 입력 (KIND 상장일 등)
      listing_endpoints: ["base_info", "ksq_base_info"]               # --listing-dates가 부르는 KRX 종목기본정보 (data_fetch.krx.endpoints)
      window_months: 1                  # 공시검색 구간 (월 단위). 구간마다 total_page 끝까지 순회
      max_pages: 100                    # 구간당 페이지 상한 (100건 × 100쪽 — 넉넉히, 초과 시 기록)
      page_count: 100
      exclude_name_patterns: ["스팩", "기업인수목적", "리츠", "부동산투자회사", "인프라"]
      markets: {"유가증권시장": "KOSPI", "코스닥시장": "KOSDAQ"}
      max_documents: 3000               # 새 원문 다운로드 상한 (캐시 재사용분 제외, 호출 간격은 data_fetch.dart.request_delay_sec)
      min_n: 10                         # 이 이상이면 band_discount = 분포 중앙값(sourced), 아니면 몬테카를로 밴드 유지
      target_n: 40                      # 표본 목표 (미달이면 요약에 사유)
      use_confidence: ["high", "medium"]
      # 하위 표본: Target Co.(공모금액 약 2,000억원대)와 비슷한 딜 — 코스피 또는 공모금액(밴드 하단 기준) ≥ 1,000억원. n ≥ sub_min_n이면 밴드에 사용
      sub_markets: ["KOSPI"]
      sub_min_offer: 1000               # 억원
      sub_min_n: 10
      size_buckets: [300, 1000]         # 공모금액 규모 구간 경계 (억원): <300 · 300~1,000 · ≥1,000
      # 이상치(원문 확인 필요 플래그): 할인율 상단 > 50% 또는 하단 < 10%. 기본 분포에 남기고, 제외 결과를 민감도로 병기
      outlier_high: 0.50
      outlier_low: 0.10
      qa_report: docs/qa/vol03_ipo_discounts.md   # 구간·시장·규모별 표본 요약 (ipo_discounts 실행 시 갱신)
      estimate_report: docs/qa/vol03_ipo_pit_estimate.md   # --estimate-log: 예전 corp_cls 제외분 중 IPO 추정 (로그만 사용)

