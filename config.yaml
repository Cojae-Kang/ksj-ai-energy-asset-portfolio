    multiples:
      basis_fy: "FY2025A"               # 현재 배수 분모 = 최근 사업연도 (Vol.1과 같은 짝: 기준일 시총 ↔ FY2025A)
      start_fy: "FY2022A"               # 보수 시나리오 분모 (2023년 첫 거래일 시총 ↔ FY2022A, Vol.1과 같음)
      applied_groups: ["domestic", "core"]   # 적용 배수 = 국내 3사 + 해외 핵심 비교군. 참고 비교군(발전·유틸리티)은 비교만
      # ASSUMPTION(judgment): 그룹 안은 합산 PER(Σ시총 ÷ Σ지배순이익) — 3~5개 피어의 산술평균은 한 회사에 좌우. 평균·중앙값 병기
      aggregation: "aggregate"
      # ASSUMPTION(judgment): 국내+해외 합산 = 두 그룹 배수의 단순평균 — 시총 가중이면 해외(미국 대형주)가 결과를 지배
      combine: "group_mean"
      outlier:                          # ASSUMPTION(judgment): 이상치 규칙 (보고서 p4에 표로 공개)
        exclude_nonpositive: true       # R1 적자(지배순이익 ≤ 0) → PER 제외
        per_max: 100                    # R2 PER > 100배 → 제외 (작은 이익의 분모 왜곡)
        exclude_entity_warn: true       # R3 SEC 재무 주체 WARN → 제외 (시총 주체 ≠ 재무 주체)
        flag_vs_median: 2.0             # R4 그룹 중앙값의 2배 초과 → 고배수 표시(포함, 합산 가중으로 영향 제한)
        ev_ebitda_max: 60               # R5 EV/EBITDA > 60배 또는 EBITDA ≤ 0 → 제외. 순차입금 미수집 → EV 제외
      # ASSUMPTION(judgment): 수동 보류(R6) — 표에는 남기고 PER·EV 배수 계산에서 제외. 해제 = 10-K 주석 확인 후 이 목록에서 삭제
      #   근거(보고서에는 데이터로 다시 계산해 표기): FY2025A 순이익 > 영업이익 × ni_to_oi_max(일회성 이익 가능성),
      #   장기차입금 태그 미보고(순현금 과대), EV/EBIT > ev_ebitda_max
      hold_out:
        GEV: {note_kr: "10-K 확인 전 제외", note_en: "Excluded pending 10-K review", ni_to_oi_max: 1.5}
      # ASSUMPTION(judgment): 정상화 배수 = 2023년 초(보수)와 현재의 로그 중간 = √(보수 × 현재).
      #   근거: Vol.1 Δln(시총) = Δln(이익) + Δln(PER) 분해와 같은 로그 척도에서 멀티플 확대분의 절반이 되돌려지는 경우
      normalization: {method: "geometric", weight: 0.5}
    discount_grid: [0.10, 0.20, 0.30, 0.40]     # 할인율 시나리오 (분석 설정, 사용자 지정 10~40%)
