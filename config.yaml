# =====================================================================
# data_fetch — 데이터 수집 파이프라인 설정 (src/data_fetch/)
# 규칙: base URL·endpoint 경로·시리즈 코드는 모두 여기서 관리. 코드에 하드코딩 금지.
#       API 키는 .env에서만 로드 (여기에는 env 변수 "이름"만 기록).
#       "ASSUMPTION(verify)"는 공식 문서로 재확인이 필요한 항목. 확인 후 태그 제거.
# =====================================================================
data_fetch:
  as_of_default: "2026-10-20"           # --asof 미지정 시 사용 (= project.as_of_date)
  fiscal_years: [2023, 2024, 2025]      # FY2023A~FY2025A
  output:
    raw_large: "data/raw/large"         # .gitignore 대상 (대용량 zip, companyfacts 원본)
    cache: "data/raw/_cache"            # 응답 캐시 (.gitignore 대상)
    processed_peers: "data/processed/peers_financials.csv"
    summary_report: "docs/qa/data_fetch_summary.md"
    peer_validation_report: "docs/qa/peer_validation.md"
    crosscheck_report_krx: "docs/qa/crosscheck_krx.md"          # KRX Open API vs FDR/pykrx
    crosscheck_report_global: "docs/qa/crosscheck_global.md"    # yfinance vs SEC
    vol03_data_notes: "research/vol03/data_notes.md"           # 해외 피어(SEC) 데이터 노트 (validate가 갱신)

  http:
    # 모든 HTTP 요청 공통 (DART·KRX·ECOS·SEC·FRED·EIA). 타임아웃이면 해당 요청만 건너뛰고 기록 후 계속.
    connect_timeout_sec: 5              # 연결 타임아웃
    read_timeout_sec: 20                # 응답 타임아웃: 응답 본문 전체 수신 상한(벽시계 기준)
    max_retries: 3                      # 최초 요청 + 재시도 최대 3회 (지수 백오프)
    backoff_base_sec: 1.0               # 1s → 2s → 4s
    max_total_wait_sec: 60              # 한 요청의 재시도·대기 포함 총 소요 상한
    retry_status: [429, 500, 502, 503, 504]
    cache_ttl_hours: 24                 # 0이면 캐시 미사용
    # 로그·meta에서 마스킹할 파라미터/헤더 이름 (대소문자 무시)
    secret_param_names: ["crtfc_key", "api_key", "apikey", "auth_key", "key", "serviceKey"]

  dart:
    env_key: "DART_API_KEY"
    base_url: "https://opendart.fss.or.kr/api"
    endpoints:
      corp_code: "corpCode.xml"
      fnltt_all: "fnlttSinglAcntAll.json"
      list: "list.json"
      document: "document.xml"
    request_delay_sec: 0.3
    license_note: "금융감독원 Open DART 공개 공시. Open DART 이용약관 확인."
    reprt_code: "11011"                 # 사업보고서
    fs_div_priority: ["CFS", "OFS"]     # 연결 우선, 없으면 별도
    # 계정 매핑: account_id 우선 → 없으면 account_nm 일치
    accounts:
      revenue:
        sj_div: ["IS", "CIS"]
        account_ids: ["ifrs-full_Revenue"]
        account_names: ["매출액", "수익(매출액)", "영업수익", "매출"]
      operating_income:
        sj_div: ["IS", "CIS"]
        account_ids: ["dart_OperatingIncomeLoss"]
        account_names: ["영업이익", "영업이익(손실)", "영업손익"]
      net_income:
        # ASSUMPTION: PER 산정용 지배주주 귀속 순이익 우선, 없으면 당기순이익(총계)으로 대체하고 플래그
        sj_div: ["IS", "CIS"]
        account_ids: ["ifrs-full_ProfitLossAttributableToOwnersOfParent"]
        account_names: ["지배기업의 소유주에게 귀속되는 당기순이익", "지배기업 소유주지분", "지배기업소유주지분"]
        fallback_account_ids: ["ifrs-full_ProfitLoss"]
        fallback_account_names: ["당기순이익", "당기순이익(손실)"]
      cash:
        sj_div: ["BS"]
        account_ids: ["ifrs-full_CashAndCashEquivalents"]
        account_names: ["현금및현금성자산"]
    # ASSUMPTION: 총차입금 = 재무상태표상 차입금·사채 계정 합계 (리스부채 제외).
    #   근거: ECM 실무의 Net debt 산정 관행(이자부부채). 회사별 주석으로 재확인할 것.
    total_debt:
      sj_div: ["BS"]
      include_name_patterns: ["차입금", "사채", "유동성장기부채"]
      exclude_name_patterns: ["할인발행차금", "상환할증금", "리스", "전환권조정", "신주인수권조정", "충당", "이자", "계약부채"]
      exclude_detail_rows: true         # account_detail이 '-'가 아닌 세부행 제외 (이중계산 방지)
      # 계정명으로 하나도 못 찾을 때만 IFRS 표준 account_id로 2차 매칭 (플래그 total_debt:id_fallback). ASSUMPTION(verify)
      #   점검: python -m src.data_fetch.dart --debt-candidates 267260 (로컬 원자료, API 호출 없음)
      # 회사별 대용치: 계정명·표준 id로 차입금을 못 찾는 회사만. 계약부채(선수금 성격)는 포함하지 않는다. 보고서에는 "주석 확인 전 대용치"
      company_overrides:
        "267260":                       # HD현대일렉트릭 — --debt-candidates 결과 '차입금' 계정명 없음, 기타금융부채에 포함된 것으로 판단
          account_ids: ["ifrs-full_OtherCurrentFinancialLiabilities", "ifrs-full_OtherNoncurrentFinancialLiabilities"]
          note: "주석 확인 전 대용치: 단기·장기 기타금융부채"
      fallback_account_ids: ["ifrs-full_ShorttermBorrowings", "ifrs-full_LongtermBorrowings", "ifrs-full_CurrentPortionOfLongtermBorrowings",
                             "ifrs-full_CurrentBorrowingsAndCurrentPortionOfNoncurrentBorrowings", "ifrs-full_NoncurrentPortionOfNoncurrentBorrowings",
                             "ifrs-full_Borrowings", "ifrs-full_BondsIssued", "ifrs-full_NoncurrentPortionOfNoncurrentBondsIssued",
                             "ifrs-full_CurrentPortionOfNoncurrentBondsIssued", "ifrs-full_NoncurrentPortionOfNoncurrentLoansReceived"]
    # 발행공시(증권신고서) 검색 + 원문 다운로드. Vol.1에는 불필요 → 기본 비활성.
    #   켜려면 enabled: true 또는 fetch_all 실행 시 --skip-filings를 빼고 실행.
    filings:
      enabled: false
      mode: "market"                    # market: corp_code 없이 window_months 단위로 분할 검색 (IPO 사례 탐색)
                                        # peers : config peers의 corp_code별로 검색 (기간 분할 불필요)
      pblntf_ty: "C"                    # 발행공시
      pblntf_detail_ty: "C001"          # ASSUMPTION(verify): C001 = 증권신고서(지분증권)
      bgn_de: "20250101"
      end_de: null                      # null이면 --asof 사용
      window_months: 3                  # corp_code 미지정 시 검색기간 3개월 제한 → 3개월 단위 반복
      page_count: 100                   # 페이지당 건수 (DART 최대 100)
      max_pages: 5                      # 구간(또는 회사)당 페이지 상한 → 초과분은 기록 후 생략
      report_nm_contains: ["증권신고서(지분증권)"]
      documents:
        rcept_nos: []                   # TODO(data): 원문을 받을 증권신고서 접수번호(rcept_no) 기입
        max_from_search: 0              # >0이면 검색 결과 상위 N건 원문 자동 다운로드

  krx:
    env_key: "KRX_API_KEY"
    base_url: "https://data-dbg.krx.co.kr/svc/apis"     # ASSUMPTION(verify): KRX Open API 호출 URL
    auth_header: "AUTH_KEY"             # ASSUMPTION(verify): 인증키를 요청 헤더 AUTH_KEY로 전달
    endpoints:
      daily_trade: "sto/stk_bydd_trd"   # 유가증권 일별매매정보 (승인됨)
      base_info: "sto/stk_isu_base_info" # 유가증권 종목기본정보 (승인됨)
      ksq_base_info: "sto/ksq_isu_base_info" # ASSUMPTION(verify): 코스닥 종목기본정보 — API 이용 신청·승인 필요
    response_block: "OutBlock_1"
    request_delay_sec: 0.5
    max_lookback_days: 10               # 기준일이 휴장일이면 직전 영업일까지 소급
    license_note: "한국거래소 KRX Open API. 이용약관 확인."
    fallback_order: ["fdr", "pykrx"]   # KRX Open API 실패 시 보조 소스 순서 (교차검증 필요)
    crosscheck_with_fdr: true           # KRX 성공 시에도 FDR 종가와 비교해 docs/qa/에 기록
    crosscheck_tolerance_pct: 0.5

  ecos:
    env_key: "ECOS_API_KEY"
    base_url: "https://ecos.bok.or.kr/api"
    # URL 형식: {base}/StatisticSearch/{KEY}/json/kr/{start_row}/{end_row}/{stat}/{cycle}/{from}/{to}/{item}
    service: "StatisticSearch"
    page_size: 10000
    request_delay_sec: 0.3
    start_date: "20230101"
    license_note: "한국은행 ECOS 공개 통계. 출처 표기: 한국은행 경제통계시스템(ECOS)."
    series:
      - id: "usdkrw_daily"
        stat_code: "731Y001"            # ASSUMPTION(verify): 주요국 통화의 대원화환율(일별)
        cycle: "D"
        item_code: "0000001"            # ASSUMPTION(verify): 원/달러(매매기준율)
        expect_item_name: "달러"         # 응답 ITEM_NAME1 검증용 키워드
        unit: "KRW per USD"
      - id: "ktb_3y"
        stat_code: "817Y002"            # ASSUMPTION(verify): 시장금리(일별)
        cycle: "D"
        item_code: "010200000"          # ASSUMPTION(verify): 국고채(3년)
        expect_item_name: "3년"
        unit: "% p.a."
      - id: "ktb_10y"
        stat_code: "817Y002"
        cycle: "D"
        item_code: "010210000"          # ASSUMPTION(verify): 국고채(10년)
        expect_item_name: "10년"
        unit: "% p.a."
    # 연평균 환율은 위 일별 시리즈로 직접 계산(단순평균, 영업일 기준). ECOS 공식 연평균 시리즈를 함께 받으려면 아래 기입.
    official_annual_fx:
      stat_code: null                   # TODO(data): ECOS 연평균 원/달러 환율 통계코드 확인 후 기입
      item_code: null
      cycle: "A"

  sec:
    env_key: "SEC_USER_AGENT"           # 키 대신 User-Agent 헤더 (이름 + 이메일)
    tickers_url: "https://www.sec.gov/files/company_tickers.json"
    base_url: "https://data.sec.gov"
    endpoints:
      companyfacts: "api/xbrl/companyfacts/CIK{cik10}.json"
    request_delay_sec: 0.2              # 요청 간 최소 간격(초)
    # SEC fair access (https://www.sec.gov/os/accessing-edgar-data): 초당 10건 이하, User-Agent(이름+이메일),
    # Accept-Encoding: gzip, deflate. 실제 간격 = max(request_delay_sec, 1 / max_requests_per_sec)
    max_requests_per_sec: 8             # 10 미만으로 유지
    session_headers:                    # www.sec.gov · data.sec.gov 모든 요청의 세션 기본 헤더 (User-Agent는 .env)
      Accept-Encoding: "gzip, deflate"
    # 403 차단 페이지 판별 문구 → 한 줄 요약에 사용. ASSUMPTION(verify): SEC 차단 페이지 문구는 바뀔 수 있음
    block_page_markers:
      "Undeclared Automated Tool": "User-Agent 미선언·형식 문제로 차단"
      "Request Rate Threshold Exceeded": "요청 속도 초과로 일시 차단 (약 10분 후 재시도)"
    license_note: "미국 SEC EDGAR 공개 공시. SEC fair access 정책 준수."
    forms: ["10-K", "10-K/A"]
    # ASSUMPTION: 회계연도 라벨 = 회계연도 종료일의 연도 (종료월이 1~5월이면 전년도). 대상 peers는 모두 12월 결산.
    fy_label_cutoff_month: 6
    flow_duration_days: [350, 380]
    metrics:
      revenue: ["RevenueFromContractWithCustomerExcludingAssessedTax", "Revenues", "SalesRevenueNet"]
      operating_income: ["OperatingIncomeLoss"]
      net_income: ["NetIncomeLoss", "ProfitLoss"]   # NetIncomeLoss = 지배주주 귀속
      cash: ["CashAndCashEquivalentsAtCarryingValue", "CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents"]
    # ASSUMPTION: 총차입금 = 장기차입금(유동성 포함) + 단기차입금/CP. 리스부채 제외. 10-K 차입금 주석으로 재확인.
    total_debt_components:
      - name: "long_term_debt_incl_current"
        alternatives:
          - ["LongTermDebt"]
          - ["LongTermDebtNoncurrent", "LongTermDebtCurrent"]
          - ["LongTermDebtAndCapitalLeaseObligations", "LongTermDebtAndCapitalLeaseObligationsCurrent"]
      - name: "short_term_borrowings"
        alternatives:
          - ["ShortTermBorrowings"]
          - ["CommercialPaper"]
    shares_tag: ["dei", "EntityCommonStockSharesOutstanding"]
    not_sec_registrants: ["SU.PA"]      # Schneider Electric: Euronext Paris 상장, SEC 공시 대상 아님
    # 오프라인 모드: 프로그램 요청이 403(네트워크·클라이언트 차단)일 때 브라우저로 받은 파일을 같은 방식으로 처리.
    #   켜는 법: fetch_all --source sec --sec-offline (또는 enabled: true). auto_on_403이면 403 발생 시 자동 전환.
    #   파일은 로컬 전용(data/raw/ 전체가 .gitignore). 데이터는 Vol.3(IPO·해외 피어)에서 사용.
    offline:
      enabled: false
      auto_on_403: true
      dir: "sec_manual"                 # paths.raw 아래 → data/raw/sec_manual/
      tickers_file: "company_tickers.json"
      companyfacts_file: "CIK{cik10}.json"
      source_label: "SEC EDGAR (manual browser download)"
      # 브라우저 다운로드 대상 CIK (사용자 로컬 확인값, company_tickers.json으로 재검증). ASSUMPTION(verify)
      expected_ciks: {VRT: 1674101, ETN: 1551182, GEV: 1996810, CEG: 1868275, VST: 1692819}
      persistent_403_hours: 24          # 403이 이 시간 이상 이어지면 '네트워크·클라이언트 차단 가능성' 안내
      state_file: "sec/_403_state.json" # paths.raw 아래. 403 최초·최근 시각 (성공 시 삭제)
    # 시총(상장사)과 재무(companyfacts 법인)의 주체 일치 검사 → data/processed/sec_entity_check.csv, validate WARN
    entity_check:
      output: "sec_entity_check.csv"    # paths.processed 아래
      # 로컬 관찰 기록 (자동 판정 전 Vol.3 데이터 노트에 표기). 오프라인 수집 후 검사 결과로 대체된다.
      watchlist:
        VST: "로컬 관찰(2026-10): CIK0001692819.json의 entityName이 'Vistra Oper...'로 시작 — 운영 자회사 재무일 가능성"
      # 수동 확인 override: 자동 판정(WARN)을 사람이 원문으로 확인해 OK로 바꾼 기록. 근거 URL·확인일 필수
      manual_overrides:
        VST:
          cik: 1692819                  # 상장사 CIK와 재무 법인 CIK가 모두 이 값일 때만 적용
          verdict: "OK"
          note: "수동 확인: 10-K registrant = Vistra Corp."
          detail: "CIK 0001692819로 제출된 10-K 표지의 registrant가 Vistra Corp.; companyfacts entityName 'Vistra Operations Company LLC'는 표기 차이로 판단"
          url: "https://www.sec.gov/Archives/edgar/data/1692819/000169281922000005/vistra-20211231.htm"
          verified_on: "2026-10-22"

  fred:
    env_key: "FRED_API_KEY"
    base_url: "https://api.stlouisfed.org/fred"
    endpoints:
      observations: "series/observations"
    request_delay_sec: 0.3
    start_date: "2023-01-01"
    license_note: "FRED, Federal Reserve Bank of St. Louis. 시리즈별 원 출처 표기 확인."
    series:
      - id: "DGS10"                     # 10-Year Treasury Constant Maturity, % p.a.
        unit: "% p.a."
      - id: "DEXKOUS"                   # South Korean Won to U.S. Dollar Spot Rate, KRW per USD
        unit: "KRW per USD"

  eia:
    env_key: "EIA_API_KEY"
    base_url: "https://api.eia.gov/v2"
    endpoints:
      retail_sales: "electricity/retail-sales/data/"
    request_delay_sec: 0.3
    source_label: "U.S. Energy Information Administration (EIA)"
    license_note: "U.S. Energy Information Administration (EIA) 공개 데이터. 출처 표기."
    frequency: "annual"
    data_fields: ["sales", "price", "revenue", "customers"]
    state: "US"
    sectors: ["ALL", "RES", "COM", "IND", "TRA", "OTH"]
    start: "2010"
    end: null                           # null이면 최신 연도까지
    page_length: 5000

  global_market:
    library: "yfinance"
    license_note: "yfinance(Yahoo Finance 비공식 래퍼) 보조 소스. 개인·연구 용도, Yahoo 약관 적용. 공식 소스와 교차검증 필수."
    lookback_days: 10
    crosscheck_tolerance_pct: 2.0       # yfinance 발행주식수 vs SEC dei 발행주식수 허용 오차

  manual_overseas_financials: "data/manual/overseas_financials_manual.csv"   # Schneider 등 SEC 비대상 기업

# =====================================================================
# research — KSJ Research Notes (research/volNN/). 수치는 모두 데이터 파일에서 계산, 문구 템플릿만 코드에 둔다.
# =====================================================================
research:
  brand: "KSJ Research"
  tagline: "AI Energy Asset Portfolio"
  author: "Shinjae Kang"
  repo_url: "https://github.com/Cojae-Kang/ksj-ai-energy-asset-portfolio"   # PDF·README는 이 값만 사용
  copyright: "© 2026 Shinjae Kang"     # 모든 페이지 바닥글 왼쪽·표지
  contact: "toonword@naver.com"        # 뒤표지 하단(GitHub 주소 아래). 커밋 작성자 이메일과 무관
  content_license: "CC BY 4.0"         # 보고서·도표·문장 (코드는 MIT, LICENSE)
  footnote:                             # 전 편 공통 각주 (research/vol01/layout.py footnote_paras)
    size: 6.9                           # 각주 글자 크기(pt) — 넘쳐도 줄이지 않는다
    min_size: 6.9                       # 최소 글자 크기: 이 아래로 내리지 않는다 (tests/test_layout_rules.py가 PDF로 확인)
    leading: 1.3
    max_share: 0.30                     # 셀 높이 대비 각주 상한 — 넘으면 ① 출처를 ' | '로 줄 묶음 ② 한 문단 ③ 그래도 넘치면 주를 '데이터 노트(계속)' 쪽으로 옮김
    sep: " | "
  table:
    min_font: 6.2                       # 표 최소 글자(draw_table 하한). 한 쪽 표가 이 글자로도 안 들어가면 쪽을 나눔((1/n)); 표 칸 문자열은 자르지 않는다
  fonts:
    dir: "assets/fonts"
    regular: "NotoSansKR-Regular.ttf"
    bold: "NotoSansKR-Bold.ttf"
    fallbacks:                          # Noto Sans KR이 없을 때 순서대로 시도 (regular, bold)
      - ["C:/Windows/Fonts/malgun.ttf", "C:/Windows/Fonts/malgunbd.ttf"]          # Windows 맑은 고딕
      - ["/usr/share/fonts/truetype/nanum/NanumGothic.ttf", "/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf"]
  colors:                               # 고급 리서치 톤: 골드·브라운·블랙·웜그레이
    charcoal: "#1C1B19"                 # 헤더 바·표 헤더 (흰 글씨)
    gold: "#B08D57"                     # 포인트: 헤더 아래 선, 핵심 숫자, 표지 선, 강조 막대
    brown_dark: "#6B4F3A"               # 보조 시리즈
    brown_mid: "#9A7B5F"
    warm_grey: "#8C857B"                # 비교 시리즈
    warm_grey_light: "#C9C2B8"
    brick: "#9C4A3A"                    # 음수·리스크 강조
    panel: "#F5F2ED"                    # 박스·음영 패널
    text: "#2B2926"                     # 본문
    note: "#7A746C"                     # 각주
    white: "#FFFFFF"

  vol01:
    output_dir: "research/vol01"
    build_dir: "research/vol01/_build"  # 차트 PNG 등 중간 산출물 (.gitignore)
    page_pt: [960, 720]                 # 가로형 4:3 (1280×960 비율)
    title_kr: "AI 전력 수요는 진짜인가, 시장은 이미 알고 있나"
    title_en: "Is AI Power Demand Real, and Does the Market Already Know?"
    subtitle_kr: "공식 데이터로 본 수요·현장·실적·시장 — 그리고 IPO 공모가에 주는 함의"
    subtitle_en: "Demand, ground truth, earnings and market pricing from official data — and what it means for IPO pricing"
    date_label: "2026.10"
    inputs:
      iea: "data/manual/iea_energy_ai.csv"
      eia_state: "data/processed/vol01_eia_state.csv"
      eia_sectors: ["data/processed/vol01_eia_us_sectors.csv", "data/processed/eia_retail_sales_annual.csv"]  # 앞에서부터 사용
      krx_points: "data/processed/vol01_krx_mcap_points.csv"
      dart: ["data/processed/dart_financials.csv", "data/processed/vol01_dart_extra.csv"]                    # 합쳐서 사용
      corporate_actions: "data/manual/krx_corporate_actions.csv"
      ktb: "data/processed/ecos_ktb_daily.csv"
      fred: "data/processed/fred_series.csv"
    fiscal_years: [2022, 2023, 2024, 2025]
    decomposition:                      # Δln(시총) = Δln(지배순이익) + Δln(PER)
      fy_start: "FY2022A"               # 2023년 첫 거래일 시총 ↔ 직전 연간 실적(FY2022A)
      fy_end: "FY2025A"                 # 최근 시총 ↔ 최근 연간 실적(FY2025A)
    iea_metrics:                        # data/manual/iea_energy_ai.csv의 metric·period
      dc_2024: {metric: "dc_electricity_consumption", period: "2024"}
      dc_2030: {metric: "dc_electricity_consumption_base", period: "2030"}
      dc_2035: {metric: "dc_electricity_consumption_base", period: "2035"}
      dc_2035_low: {metric: "dc_electricity_consumption_range_low", period: "2035"}
      dc_2035_high: {metric: "dc_electricity_consumption_range_high", period: "2035"}
      share_2024: {metric: "dc_share_of_global_electricity", period: "2024"}
      cagr_17_24: {metric: "dc_consumption_growth_rate", period: "2017-2024"}
      region_us: {metric: "dc_regional_share_US", period: "2024"}
      region_cn: {metric: "dc_regional_share_China", period: "2024"}
      region_eu: {metric: "dc_regional_share_Europe", period: "2024"}
      growth_dc: {metric: "dc_demand_growth_yoy", period: "2025"}
      growth_ai: {metric: "ai_dc_demand_growth_yoy", period: "2025"}
      growth_global: {metric: "global_electricity_demand_growth_yoy", period: "2025"}
    # A. fetch_extra.py 수집 범위 (로컬 실행)
    eia_state:
      states: ["VA", "US"]
      sector: "COM"                     # commercial
      start: "2015"
      base_year: 2015                   # 지수 기준연도 (=100)
      divergence_pts: 5                 # 최근연도 지수 차이(VA − US)가 ±이 값 이상이면 '앞섬/뒤처짐', 아니면 '비슷'
    eia_sectors:
      state: "US"
      sectors: ["RES", "COM", "IND"]    # 주거·상업·산업
      data_fields: ["sales", "price"]
      start: "2015"
    dart_extra_years: [2022]            # 기존 dart_financials(FY2023~2025)에 더할 연도
    krx_points:
      start_from: "2023-01-01"          # 이 날부터 앞으로 찾은 첫 거래일 = 2023년 첫 거래일
      max_forward_days: 10
      max_lookback_days: 10             # 기준일 직전 거래일 탐색 범위 (기준일 당일 제외)
    # ASSUMPTION: 리스크 매트릭스 위치(가능성·영향, 1~5)는 저자의 정성 판단. 근거 데이터는 보고서 각주에 숫자로 표기.
    risk_matrix:
      - {key: "outlook", likelihood: 3, impact: 4}       # 전망 불확실성 (IEA 2035 범위)
      - {key: "cycle_peak", likelihood: 4, impact: 4}    # 사이클 고점 (현재 PER 수준)
      - {key: "rates", likelihood: 3, impact: 3}         # 금리 (국고채·미 국채 10년)
      - {key: "supply_chain", likelihood: 2, impact: 3}  # 공급망 (정성)
    text_rules:
      big_move_multiple: 1.5            # 시총 합계 배수가 이 이상이면 "크게 움직였다"
      multiple_led_share: 0.5           # 멀티플 기여 비중이 이 값 초과면 "멀티플이 이익보다 앞서 달렸다"
    source_status_override:
      sec: "Vol.3에서 사용"              # 해외 피어(SEC) 비교는 Vol.3. Vol.1 A2 출처 표에는 싣지 않음
      krx: "교차검증 미해소|Cross-check open"   # docs/qa/crosscheck_krx.md: 4사 CHECK(−4.6~−8.3%) — 비교일 불일치 추정, TODO(data): 같은 날짜로 재검증
    source_note_kr: "KRX 종가는 보조 소스(FinanceDataReader) 대비 −4.6~−8.3% 차이가 미해소(비교 날짜 불일치로 추정, 재검증 대기 — docs/qa/crosscheck_krx.md)"
    source_note_en: "KRX closes differ from the secondary source (FinanceDataReader) by −4.6% to −8.3%, unresolved (likely a date mismatch; re-check pending)"

  # -------------------------------------------------------------------
  # Vol.2 — AI 데이터센터 PF (케이스 A 한국 40MW·원화, 케이스 B 미국 100MW·달러). 실존 프로젝트 아님.
  # 모든 가정: {value, unit, tag, source}. 근거를 모르는 값은 value: null + todo → 빌드는 그 계산만 건너뛰고 회색 박스.
  # 사용자가 data/manual/vol02_assumptions.csv(케이스, 항목, 값, 단위, 출처명, URL, 발행일, 쪽수)에 값을 넣으면
  # 그 값이 여기 값보다 우선한다 (출처명이 비어 있으면 빌드 요약에 '출처 미기재'로 표시).
  # tag: ASSUMPTION(design) 가상 케이스 설계값 / ASSUMPTION(verify) 공개 근거 있음, 원문 확인 필요 /
  #      ASSUMPTION(neutral) 근거 부재 시 중립값 / DATA 저장소 데이터에서 계산
  # -------------------------------------------------------------------
  vol02:
    output_dir: "research/vol02"
    gearing_basis: "capex"             # ASSUMPTION(judgment): 최대 대출 비율의 분모 = CAPEX. 금융비용(IDC·이자유보계좌·DSRA) 제외 — 금리에 연동되는 항목을 빼 위험↑→대출↑ 왜곡과 순환 참조 제거. 기존 두 방식(total 총사업비, ex_financing CAPEX+DSRA)은 p3 민감도 행·build_summary에 유지
    gearing_benchmark:                  # 비교 사례(케이스 A): 총사업비 대비 대출 비율 — p3 각주·민감도 행 (가정 아님)
      case: "A"
      debt: 6576                        # 억원, 군산 데이터센터 본PF
      cost: 8700                        # 억원, 사업비
      tier: "B"                         # 보도(이데일리) — 원문(대주단 공시 등) 대조 전
      source_kr: "이데일리(2026-10-12): 군산 데이터센터 본PF 6,576억원 ÷ 사업비 8,700억원"
      source_en: "Edaily (12 Oct 2026): Gunsan data-centre PF KRW 657.6bn ÷ project cost KRW 870bn"
      url: "https://en.edaily.co.kr/news/eda202610125649/"
    yoc_check_band: [0.08, 0.14]        # ASSUMPTION(judgment): 원가 대비 수익률 점검 범위(저자 설정, 공개 출처 없음) — p7 차트 음영, ±1%p 허용
    build_dir: "research/vol02/_build"
    page_pt: [960, 720]
    title_kr: "AI 데이터센터, 대출은 얼마까지 가능한가"
    title_en: "How Much Can an AI Data Centre Borrow?"
    subtitle_kr: "대주의 눈으로 본 한국 40MW와 미국 100MW"
    subtitle_en: "A lender's view of a 40 MW Korean and a 100 MW U.S. project"
    date_label: "2026.10"
    as_of: "2026-10-20"                 # 금리·환율 기준일
    assumptions_csv: "data/manual/vol02_assumptions.csv"
    inputs:
      iea: "data/manual/iea_energy_ai.csv"
      ktb: "data/processed/ecos_ktb_daily.csv"
      fx: "data/processed/ecos_fx_daily.csv"
      fred: "data/processed/fred_series.csv"
      dart: ["data/processed/dart_financials.csv", "data/processed/vol01_dart_extra.csv"]
      eia_state: "data/processed/vol01_eia_state.csv"             # VA·US 상업용 판매량
      eia_sectors: ["data/processed/vol01_eia_us_sectors.csv", "data/processed/eia_retail_sales_annual.csv"]
      eia_va_price: "data/processed/vol02_eia_va_com.csv"         # TODO(data): research.vol02.fetch_extra (로컬)
    # 수요 → 가동률 램프업 시나리오: IEA 데이터센터 전력 소비 2024 → 2035 연평균 성장률 (data/manual/iea_energy_ai.csv)
    demand_scenarios:
      base_year: {metric: "dc_electricity_consumption", period: "2024"}
      downside: {metric: "dc_electricity_consumption_range_low", period: "2035"}
      base: {metric: "dc_electricity_consumption_base", period: "2035"}
      upside: {metric: "dc_electricity_consumption_range_high", period: "2035"}
      # ASSUMPTION(neutral): 시나리오 확률 동일 가중 (확률 근거 자료 없음)
      weights: {downside: 0.3333333333, base: 0.3333333333, upside: 0.3333333333}
    # 공사비 위험: 피어 영업이익률 상승 → '전력기기 가격 결정력'의 근거 (인과 단정 아님)
    #   함의 가격 상승률 = (1 − OPM 시작) ÷ (1 − OPM 끝) − 1 : 단위 원가가 그대로이고 이익률 상승이 모두 가격에서
    #   왔다고 가정한 상한값. 저·중·고 = 3사 중 최소 · 3사 합산 · 최대
    capex_stress:
      peers: ["267260", "010120", "298040"]          # HD현대일렉트릭·LS ELECTRIC·효성중공업
      fy_start: "FY2022A"
      fy_end: "FY2025A"
    rates:
      A: {construction: "ktb_3y", term: "ktb_3y"}   # ECOS 국고채 3년 (사용자 지정: 기준금리 = 국고채 3년)
      B: {construction: "DGS10", term: "DGS10"}      # FRED DGS10 (건설기간 단기금리 시리즈 미보유 → 같은 값)
    # 계통 승인 현황 (케이스 A 설정 근거). 건수 기준 1.9%(522건 중 10건), 용량 기준 3.0%(33,592MW 중 1,010MW) — 두 기준 모두 표기
    grid_stats:
      period: "2024.8~2026.3"
      basis_note: "수도권 1단계 계통 신청 전체 기준(최종 공급 승인)"
      source: {name: "블록미디어, 국내 AI 데이터센터 프로젝트 4건의 가동 준비 현황과 손익분기 조건",
               url: "https://www.blockmedia.co.kr/archives/1141412", tag: "ASSUMPTION(sourced)",
               note: "2024.8~2026.3 수도권 1단계 신청 522건·33,592MW 중 최종 공급 승인 10건·1,010MW (원문 확인 완료)"}
      applied_mw: {value: 33592, unit: "MW", tag: "ASSUMPTION(sourced)", source: "블록미디어 (grid_stats.source)"}
      approved_mw: {value: 1010, unit: "MW", tag: "ASSUMPTION(sourced)", source: "블록미디어 (grid_stats.source)"}
      applied_count: {value: 522, unit: "건", tag: "ASSUMPTION(sourced)", source: "블록미디어 (grid_stats.source)"}
      approved_count: {value: 10, unit: "건", tag: "ASSUMPTION(sourced)", source: "블록미디어 (grid_stats.source)"}
      review_threshold_mw: {value: 10, unit: "MW", tag: "ASSUMPTION(verify)",
                            source: "분산에너지 활성화 특별법 — 전력계통영향평가 (10MW 이상)", todo: "TODO(source): 조문·시행령 번호 확인"}
    cases:
