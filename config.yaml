      mc:
        growth_mean: {value: null, derive: "peer_log_growth_mean", unit: "%", tag: "DATA", source: "DART 3사 연간 매출 성장률 FY2023A~FY2025A(9개 관측) 로그 평균"}
        growth_sd: {value: null, derive: "peer_log_growth_sd", unit: "%", tag: "DATA", source: "위 9개 관측의 로그 표준편차"}
        per_shape: {value: "triangular", unit: "-", tag: "ASSUMPTION(neutral)", source: "1년 후 PER = 삼각분포(최소 보수 · 최빈 정상화 · 최대 현재) — 시나리오 확률 근거 부재 시 중립 형태"}
        band_q_low: {value: 0.25, unit: "%", tag: "ASSUMPTION(judgment)", source: "밴드 하단 = 1년 후 주당가치 하위 25% (하단 공모 시 1년 후 손실 확률 25%)"}
        band_q_high: {value: 0.5, unit: "%", tag: "ASSUMPTION(judgment)", source: "밴드 상단 = 1년 후 주당가치 중앙값 (상단 공모 시 손실 확률 50%)"}
